name: Windows bundles

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-pc-windows-msvc, i686-pc-windows-msvc]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build CLAP + VST3
        run: cargo xtask bundle nrum-sequencer --release --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: nrum-sequencer-${{ matrix.target }}
          # nice-plug's xtask (like nih-plug's) always writes to target/bundled, whatever --target is.
          path: target/bundled
