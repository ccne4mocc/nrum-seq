name: Bundles

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  bundle:
    name: Bundle (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
          - name: windows-x86_64
            os: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux windowing dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libfontconfig1-dev \
            libgl1-mesa-dev

      - name: Install Rust (Linux)
        if: runner.os == 'Linux'
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust (Windows)
        if: runner.os == 'Windows'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2

      - name: Build Linux bundle
        if: runner.os == 'Linux'
        run: cargo xtask bundle nrum-seq --release

      - name: Build Windows bundle
        if: runner.os == 'Windows'
        run: cargo xtask bundle nrum-seq --release --target x86_64-pc-windows-msvc

      - name: Package Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p stage dist
          cp -a target/bundled/. stage/
          cp LICENSE README.md stage/
          tar -czf "dist/nrum-seq-${GITHUB_REF_NAME}-linux-x86_64.tar.gz" -C stage .

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force stage, dist | Out-Null
          Copy-Item -Path target/bundled/* -Destination stage -Recurse -Force
          Copy-Item -Path LICENSE, README.md -Destination stage -Force
          Compress-Archive -Path stage/* -DestinationPath "dist/nrum-seq-$env:GITHUB_REF_NAME-windows-x86_64.zip" -Force

      - uses: actions/upload-artifact@v7
        with:
          name: nrum-seq-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Attach release assets
    if: startsWith(github.ref, 'refs/tags/')
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
